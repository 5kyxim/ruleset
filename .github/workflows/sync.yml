name: Sync sing-box rules

on:
  schedule:
    - cron: '17 0 * * *'
    - cron: '43 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['.github/keepalive']

permissions:
  contents: write

concurrency:
  group: sync-rules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main

      - name: Configure publication identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Keep default branch active after 30 days
        run: bash scripts/keepalive.sh

      - name: Checkout immutable upstream snapshot
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: Loyalsoldier/clash-rules
          ref: release
          path: build/upstream
          persist-credentials: false

      - name: Compare source and build inputs
        id: inputs
        shell: bash
        run: |
          upstream_sha=$(git -C build/upstream rev-parse HEAD)
          # Includes scripts, dependencies, documentation and workflow changes.
          build_id=$(git ls-tree -r HEAD -- .github/workflows scripts tests requirements.txt README.md LICENSE | sha256sum | cut -d ' ' -f 1)
          printf '%s\n%s\n' "$upstream_sha" "$build_id" > build/inputs.txt
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          remote_ref=$(git ls-remote --heads origin refs/heads/release)
          if [[ -n "$remote_ref" ]]; then
            git fetch --no-tags origin refs/heads/release:refs/remotes/origin/release
            git show refs/remotes/origin/release:inputs.txt > build/previous-inputs.txt || true
          fi
          if [[ -f build/previous-inputs.txt ]] && cmp -s build/inputs.txt build/previous-inputs.txt; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install fixed build tools
        if: steps.inputs.outputs.changed == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          curl -fL --retry 3 -o "$RUNNER_TEMP/sing-box.tar.gz" \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.1/sing-box-1.14.1-linux-amd64.tar.gz
          echo "12cb2816b52febb356f6a885b740cc8758c3f30b8ae0ca8edba80f0d2d35343f  $RUNNER_TEMP/sing-box.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/sing-box.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sing-box-1.14.1-linux-amd64" >> "$GITHUB_PATH"

      - name: Test conversion semantics
        if: steps.inputs.outputs.changed == 'true'
        run: python -m unittest discover -s tests -v

      - name: Convert and compile all rules
        if: steps.inputs.outputs.changed == 'true'
        run: |
          python scripts/convert.py --source build/upstream --output build/publish
          cp build/inputs.txt build/publish/inputs.txt

      - name: Publish one complete snapshot
        if: steps.inputs.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.inputs.outputs.upstream_sha }}
        run: bash scripts/publish.sh build/publish "$RUNNER_TEMP/release" "$UPSTREAM_SHA"
